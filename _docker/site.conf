server {
    listen 80;
    server_name _;
    error_log  /dev/stdout info;
    access_log /dev/stdout;

    root /static;
    index /index.html;

    error_page 404 /index.html;
    error_page 500 /index.html;

    # Resolve the backend through Docker's DNS at request time (cached 10s) instead of once at
    # startup, so a recreated container with a new IP doesn't leave nginx proxying to a dead
    # address. The variable in proxy_pass is what forces the re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend trdosl-java;

    location /api/ {
        # A variable in proxy_pass disables nginx's prefix replacement, so strip /api/ explicitly.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend:8170;
        proxy_set_header Host $host;
    }

    location = / {
        try_files /index.html /index.html;
        add_header Cache-Control 'no-store';
    }
    location = /innlegg {
        try_files /index.html /index.html;
        add_header Cache-Control 'no-store';
    }
    location = /legg-til {
        try_files /index.html /index.html;
        add_header Cache-Control 'no-store';
    }

    # Static and assets
    location /static {
        expires 30d;
    }
}
