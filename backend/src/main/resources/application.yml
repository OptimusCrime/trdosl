logging:
  level:
    root: ${LOGGING:debug}

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 4
      min-spare: 1
    max-connections: 3
    accept-count: 3

spring:
  application:
    name: trdosl

  datasource:
    url: jdbc:sqlite:${DB_PATH:./database/trdosl.db}
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: sa

  jpa:
    database-platform: org.sqlite.hibernate.dialect.SQLiteDialect